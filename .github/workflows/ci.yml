name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zip, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: bash scripts/check.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/e2e.mjs
        env:
          LOLA_E2E_MODE: production
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup.ps1
      - run: node --test scripts/tests/process.test.mjs scripts/tests/runtime.test.mjs
      - run: php artisan test
        working-directory: backend
      - run: npm.cmd run lint
        working-directory: frontend
      - run: npm.cmd run typecheck
        working-directory: frontend
      - run: npx.cmd playwright install chromium
        working-directory: frontend
      - run: node scripts/e2e.mjs
        env:
          LOLA_E2E_MODE: production
